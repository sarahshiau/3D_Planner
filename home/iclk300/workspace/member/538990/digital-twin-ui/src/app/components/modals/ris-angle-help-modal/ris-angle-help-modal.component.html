<div class="modal-overlay" (click)="onBackdropClick()" [style.zIndex]="zIndexBase">
  <div class="modal-card modal-card--img" (click)="$event.stopPropagation()" [style.zIndex]="zIndexBase + 1">
    <div class="modal-header">
      <div class="modal-title">{{ title }}</div>
      <button class="close-btn" type="button" (click)="onClose()" aria-label="close">✕</button>
    </div>

    <div class="modal-body">
      <div class="img-wrap">
        <img [src]="imgSrc" alt="RIS angle help" />
      </div>
    </div>

    <div class="modal-footer modal-footer--right">
      <button class="view-btn" type="button" (click)="onClose()">關閉</button>
    </div>
  </div>
</div>
