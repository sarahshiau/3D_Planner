<!-- overlay -->
<div class="modal-overlay" (click)="onBackdropClick()" [style.zIndex]="zIndexBase">
  <div class="modal-card modal-card--narrow" (click)="$event.stopPropagation()" [style.zIndex]="zIndexBase + 1">

    <!-- Header -->
    <div class="modal-header">
      <div class="modal-title">新增自訂無線衰減模型</div>

      <button class="close-btn" type="button" (click)="onClose()" aria-label="close">
        ✕
      </button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      <!-- 公式區（只顯示說明，不影響你未來要換成別的公式） -->
      <div class="formula-block">
        <div class="formula-text">Ltotal = 20 log10 f + distancePowerLoss log10 d + fieldLoss - 28</div>
        <div class="formula-note">
          f：傳輸頻率(MHz)；d：距離(公尺)；註：自由空間傳播可視為 20 log10 f - 2
        </div>
      </div>

      <form [formGroup]="form" class="form-grid">
        <!-- 新增模型方式 -->
        <div class="form-row">
          <div class="label-cell">新增模型方式</div>
          <div class="field-cell field-cell--radio">
            <label class="radio-label">
              <input
                type="radio"
                formControlName="mode"
                value="manual"
              />
              輸入公式
            </label>
            <label class="radio-label">
              <input
                type="radio"
                formControlName="mode"
                value="import"
              />
              匯入檔案
            </label>
          </div>
        </div>

        <!-- 模型名稱 -->
        <div class="form-row">
          <div class="label-cell">模型名稱</div>
          <div class="field-cell">
            <input class="text-input" type="text" formControlName="name" />
          </div>
        </div>

        <!-- 距離功率損耗係數 (manual: enabled, import: disabled) -->
        <div class="form-row">
          <div class="label-cell">距離功率損耗係數 (N)</div>
          <div class="field-cell">
            <input
              class="text-input text-input--sm"
              type="text"
              formControlName="distancePowerLoss"
            />
          </div>
        </div>

        <!-- 場域耗損係數 (manual: enabled, import: disabled) -->
        <div class="form-row">
          <div class="label-cell">場域耗損係數 (Lf)</div>
          <div class="field-cell">
            <input
              class="text-input text-input--sm"
              type="text"
              formControlName="fieldLoss"
            />
          </div>
        </div>

        <!-- 無線訊號衰減模型資料 (import mode only) -->
        <ng-container *ngIf="form.get('mode')?.value === 'import'">
          <div class="form-row">
            <div class="label-cell">
              無線訊號衰減模型資料
              <a class="link-btn" href="javascript:void(0)" (click)="downloadTemplate()">
                (下載)
              </a>
            </div>

            <div class="field-cell field-cell--file">
              <input
                #fileInput
                class="file-input"
                type="file"
                accept=".xlsx,.xls"
                (change)="onFileSelected($event)"
              />

              <button class="view-btn" type="button" (click)="fileInput.click()">上傳檔案</button>

              <span class="file-name">
                {{ selectedFileName || '未選擇檔案' }}
              </span>
            </div>
          </div>
        </ng-container>
      </form>
    </div>

    <!-- Footer -->
    <div class="modal-footer modal-footer--right">
      <button class="view-btn" type="button" (click)="onCancel()">取消</button>
      <button class="primary-btn" type="button" (click)="onConfirm()">確定</button>
    </div>

  </div>
</div>
